name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    name: Run Vitest Suite & Lint
    runs-on: ubuntu-latest

    strategy:
      matrix:
        # Node 22+: pdfjs-dist 4.10+ modern build requires Promise.withResolvers (missing in Node 20)
        node-version: [22.x, 24.x, 26.x]

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run unit & algorithm test suite
        run: npm test

      - name: Verify build artifacts
        run: npm run build
